# StackHost configuration file
# Version: 2.0.0

user:
  name: "你的GitHub用户名"
  github: "你的GitHub用户名"

runtime:
  image: python:3.11-slim

commands:
  package: "curl openssl bash"
  build:
    - pip install --no-cache-dir -r requirements.txt
  start: python3 app.py

repository:
  branch: main
  auto_deploy: true

env: []
